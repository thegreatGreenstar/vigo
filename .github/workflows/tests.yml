name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every file
        run: python -m compileall -q vigo tests

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.3

      - name: Lint
        run: ruff check --output-format=github .

  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The settings file stays outside the repo
        run: |
          if git ls-files | grep -E '(^|/)vigo\.json$'; then
            echo "::error::vigo.json holds a bot token; it must never be committed"
            exit 1
          fi
          if git grep -nE 'Bot [A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}'; then
            echo "::error::a Discord bot token is in the tree"
            exit 1
          fi
