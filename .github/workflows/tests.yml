name: tests

# Two stages, so a draft answers the cross-platform question in one Python and
# a pull request that is ready answers the version question too.
#
#   draft        quick: one Python (the newest in the matrix) on macOS and Windows
#   ready        test:  every Python (3.12, 3.13, 3.14) on macOS and Windows
#   push to main test, because that is what the branch holds
#
# Linux is not in this file.  It runs in a Codespace:
#
#   tests/ci-codespace.sh          # 3.12, 3.13 and 3.14, ruff, the secrets check
#
# Codespaces inherited hours are already paid for, and its devcontainer holds
# the three Pythons (`.devcontainer/`).  Codespaces is Linux only, so this file
# keeps the two platforms no codespace can answer: macOS and Windows, where a
# path, a clock or a socket is the question.
#
# Lint and the secrets check are cheap and platform-free, so they stay on a
# runner and run on every push and pull request, with no codespace made.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The newest Python in the matrix: what a draft runs on both runners.
  QUICK_PYTHON: "3.14"

jobs:
  quick:
    name: quick · ${{ matrix.os }}
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.QUICK_PYTHON }}

      - name: Compile every file
        run: python -m compileall -q vigo tests

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every file
        run: python -m compileall -q vigo tests

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.4

      - name: Lint
        run: ruff check --output-format=github .

  secrets:
    name: no secrets in the tree or history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The settings file stays outside the repo
        run: |
          if git ls-files | grep -E '(^|/)vigo\.json$'; then
            echo "::error::vigo.json holds a bot token; it must never be committed"
            exit 1
          fi
          if git grep -nE 'Bot [A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}'; then
            echo "::error::a Discord bot token is in the tree"
            exit 1
          fi

      - name: The history holds no token either
        run: |
          # A public repository exposes every commit, not only the checked out
          # tree.  A token that was committed once and removed still works.
          if git log --all --format='%H %s%n%b' -p --no-color -- . \
              | grep -nE 'Bot [A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{20,}'; then
            echo "::error::a Discord bot token is in the history; rotate it and rewrite the history before publishing"
            exit 1
          fi
