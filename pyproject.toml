[project]
name = "vigo"
version = "1.0.0"
description = "Your OpenCode agent on your own machines, reachable from Discord"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vigo = "vigo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vigo"]
