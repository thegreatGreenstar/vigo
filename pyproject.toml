[project]
name = "vigo"
version = "1.1.0"
description = "Your OpenCode agent on your own machines, reachable from Discord"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vigo = "vigo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vigo"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# Deliberately narrow: correctness and the two rules this code must obey.
select = ["E4", "E7", "E9", "F", "W", "UP", "BLE"]
ignore = [
    # A blind catch is deliberate where a run must always finish and unregister,
    # and where data from another program must not kill the bot. Each site says
    # why in the line above it.
    "BLE001",
]

